bundle:
  name: appkit-genie

variables:
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "appkit-genie"
      description: "Node.js app with AI/BI Genie for natural language data queries"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-ff521c7e-87e3.cloud.databricks.com

    variables:
      genie_space_id: 01f1b8dfe4aa125b834d587c45af0915
      genie_space_name: "Collections Performance and Recovery Analytics 2026-09-25 12:51:58"
