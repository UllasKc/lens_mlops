<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1030" viewBox="0 0 1920 1030"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9384"/></marker></defs><rect width="1920" height="1030" fill="#FFFFFF"/><text x="70" y="92" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B2545" text-anchor="start">How LensS MLOps works</text><text x="70" y="134" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="start">Ask about your ML models in plain English, get a checked answer from your own model-monitoring data, all inside Databricks.</text><rect x="70" y="190" width="405" height="420" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="122" cy="248" r="28" fill="#0E9384"/><text x="122" y="259" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="166" y="260" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B2545" text-anchor="start">People</text><text x="102" y="318" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Operations leaders, ML engineers</text><text x="102" y="343.65" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">and analysts sign in once with</text><text x="102" y="369.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">their work account.</text><circle cx="110" cy="420" r="5" fill="#0E9384"/><text x="128" y="426" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Open LensS MLOps in a browser</text><circle cx="110" cy="460" r="5" fill="#0E9384"/><text x="128" y="466" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">See only what they are allowed to</text><circle cx="110" cy="500" r="5" fill="#0E9384"/><text x="128" y="506" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Never touch the raw data</text><line x1="481" y1="400" x2="527" y2="400" stroke="#0E9384" stroke-width="4" marker-end="url(#ah)"/><rect x="535" y="190" width="405" height="420" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="587" cy="248" r="28" fill="#0E9384"/><text x="587" y="259" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="631" y="260" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B2545" text-anchor="start">The LensS MLOps app</text><text x="567" y="318" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">One place to see the fleet and</text><text x="567" y="343.65" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">ask questions.</text><circle cx="575" cy="394" r="5" fill="#0E9384"/><text x="593" y="400" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Command Center: the fleet at a</text><text x="593" y="424.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">glance</text><circle cx="575" cy="458" r="5" fill="#0E9384"/><text x="593" y="464" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Explorer: filter and drill in</text><circle cx="575" cy="498" r="5" fill="#0E9384"/><text x="593" y="504" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Assistant: ask anything, quick or</text><text x="593" y="528.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">deep</text><circle cx="575" cy="562" r="5" fill="#0E9384"/><text x="593" y="568" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Observability: quality, safety,</text><text x="593" y="592.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">cost</text><line x1="946" y1="400" x2="992" y2="400" stroke="#0E9384" stroke-width="4" marker-end="url(#ah)"/><rect x="1000" y="190" width="405" height="420" rx="18" fill="#0E9384" stroke="#0E9384" stroke-width="1.5"/><circle cx="1052" cy="248" r="28" fill="#FFFFFF"/><text x="1052" y="259" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E9384" text-anchor="middle">3</text><text x="1096" y="260" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">The brains</text><text x="1032" y="318" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#E6FFFB" text-anchor="start">AI that understands the question</text><text x="1032" y="343.65" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#E6FFFB" text-anchor="start">and finds the answer.</text><circle cx="1040" cy="394" r="5" fill="#25E2CC"/><text x="1058" y="400" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Genie turns questions into data</text><text x="1058" y="424.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">queries</text><circle cx="1040" cy="458" r="5" fill="#25E2CC"/><text x="1058" y="464" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">AI models pick quick or deep, and</text><text x="1058" y="488.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">check answers</text><circle cx="1040" cy="522" r="5" fill="#25E2CC"/><text x="1058" y="528" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Remembers the conversation</text><line x1="1411" y1="400" x2="1457" y2="400" stroke="#0E9384" stroke-width="4" marker-end="url(#ah)"/><rect x="1465" y="190" width="405" height="420" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="1517" cy="248" r="28" fill="#0E9384"/><text x="1517" y="259" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="1561" y="260" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B2545" text-anchor="start">Trusted data</text><text x="1497" y="318" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">The model-monitoring data,</text><text x="1497" y="343.65" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">quality-checked and certified.</text><circle cx="1505" cy="394" r="5" fill="#0E9384"/><text x="1523" y="400" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Predictions, drift, confidence,</text><text x="1523" y="424.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">alerts, incidents, value</text><circle cx="1505" cy="458" r="5" fill="#0E9384"/><text x="1523" y="464" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Thresholds kept as business rules</text><circle cx="1505" cy="498" r="5" fill="#0E9384"/><text x="1523" y="504" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start">Every definition written down</text><rect x="70" y="640" width="1780" height="130" rx="18" fill="#0B2545" stroke="#0B2545" stroke-width="1.5"/><text x="110" y="690" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="700" fill="#25E2CC" text-anchor="start">Safety and trust on every step</text><circle cx="110" cy="734" r="6" fill="#25E2CC"/><text x="126" y="741" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Personal details are masked</text><circle cx="555" cy="734" r="6" fill="#25E2CC"/><text x="571" y="741" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Unsafe or off-topic requests are stopped</text><circle cx="1000" cy="734" r="6" fill="#25E2CC"/><text x="1016" y="741" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Every number is checked against the data</text><circle cx="1445" cy="734" r="6" fill="#25E2CC"/><text x="1461" y="741" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Every answer is logged and can be reviewed</text><rect x="70" y="806" width="566.6666666666666" height="150" rx="18" fill="#E3F8F5" stroke="#BFE9E3" stroke-width="1.5"/><text x="102" y="856" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B2545" text-anchor="start">Data stays home</text><text x="102" y="894" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Everything runs inside your own Databricks</text><text x="102" y="918.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">workspace; nothing is sent elsewhere.</text><rect x="676.6666666666666" y="806" width="566.6666666666666" height="150" rx="18" fill="#E3F8F5" stroke="#BFE9E3" stroke-width="1.5"/><text x="708.6666666666666" y="856" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B2545" text-anchor="start">Answers you can trust</text><text x="708.6666666666666" y="894" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Answers come only from certified data, with the</text><text x="708.6666666666666" y="918.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">figures checked and the source shown.</text><rect x="1283.3333333333333" y="806" width="566.6666666666666" height="150" rx="18" fill="#E3F8F5" stroke="#BFE9E3" stroke-width="1.5"/><text x="1315.3333333333333" y="856" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B2545" text-anchor="start">Simple to run</text><text x="1315.3333333333333" y="894" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Set up with one command, tested before every</text><text x="1315.3333333333333" y="918.3" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">release, and switches itself off when nobody is</text><text x="1315.3333333333333" y="942.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">using it.</text><text x="70" y="1006" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">LensS MLOps  ·  Concentrix Data &amp; Analytics Practice</text></svg>